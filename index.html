<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piguła Geopolityczna</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: rgba(22, 26, 35, 0.65);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #c5a059; /* Gold accent */
            --like-color: #4caf50;
            --dislike-color: #f44336;
            --text-color: #e5e9f0;
            --text-muted: #8892b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background-image: radial-gradient(circle at 50% 0%, rgba(30, 39, 56, 0.4) 0%, rgba(11, 12, 16, 1) 100%);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin: 20px 0 10px;
            background: linear-gradient(90deg, #ffffff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .news-item {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .news-item:hover {
            border-color: rgba(197, 160, 89, 0.2);
        }

        .news-item h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .news-item p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        button.vote-btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-like {
            background: rgba(76, 175, 80, 0.08);
            color: #81c784;
            border: 1px solid rgba(76, 175, 80, 0.2);
        }

        .btn-like:hover, .btn-like.active {
            background: var(--like-color);
            color: #ffffff;
            border-color: var(--like-color);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.2);
        }

        .btn-dislike {
            background: rgba(244, 67, 54, 0.08);
            color: #e57373;
            border: 1px solid rgba(244, 67, 54, 0.2);
        }

        .btn-dislike:hover, .btn-dislike.active {
            background: var(--dislike-color);
            color: #ffffff;
            border-color: var(--dislike-color);
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.2);
        }

        .comment-area {
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 13px;
            color: var(--text-color);
            resize: none;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .comment-area:focus {
            border-color: var(--accent-color);
        }

        /* Submit Section */
        .submit-section {
            margin: 40px 0 60px;
            text-align: center;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--accent-color), #d9b877);
            color: #0b0c10;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(197, 160, 89, 0.25);
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(197, 160, 89, 0.4);
        }
    </style>
</head>
<body>
    <h1>Dzisiejsza Piguła</h1>
    <div class="subtitle" id="date-subtitle">Środa, 28 lipca 2026</div>

    <div id="news-container">
        <!-- News 1 -->
        <div class="news-item" data-id="1">
            <h3>Ukraina: "Strefa Śmierci"</h3>
            <p>Drony czynią broń pancerną bezużyteczną na 30 km froncie. Podziemne nory zastępują okopy.</p>
            <div class="btn-group">
                <button class="vote-btn btn-like" onclick="selectVote(1, 'LIKE')">LUBIĘ</button>
                <button class="vote-btn btn-dislike" onclick="selectVote(1, 'DISLIKE')">NIE LUBIĘ</button>
            </div>
            <textarea class="comment-area" placeholder="Dodaj krótki komentarz/notatkę (opcjonalnie)..."></textarea>
        </div>
        <!-- News 2 -->
        <div class="news-item" data-id="2">
            <h3>Eksplozja w Cieśninie Ormuz</h3>
            <p>Tankowiec wpłynął na minę morską po zboczeniu z kursu. Wzrost napięcia w regionie.</p>
            <div class="btn-group">
                <button class="vote-btn btn-like" onclick="selectVote(2, 'LIKE')">LUBIĘ</button>
                <button class="vote-btn btn-dislike" onclick="selectVote(2, 'DISLIKE')">NIE LUBIĘ</button>
            </div>
            <textarea class="comment-area" placeholder="Dodaj krótki komentarz/notatkę (opcjonalnie)..."></textarea>
        </div>
    </div>

    <div class="submit-section">
        <button class="submit-btn" onclick="submitAllFeedback()">Wyślij dzisiejsze opinie (1 kliknięcie)</button>
    </div>

    <script>
        // Set dynamic date in human-friendly polish format
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date-subtitle').textContent = new Date().toLocaleDateString('pl-PL', options);

        // Keep track of votes
        const userVotes = {};

        function selectVote(newsId, action) {
            // Find the item container
            const item = document.querySelector(`.news-item[data-id="${newsId}"]`);
            const likeBtn = item.querySelector('.btn-like');
            const dislikeBtn = item.querySelector('.btn-dislike');

            if (action === 'LIKE') {
                if (userVotes[newsId] === 'LIKE') {
                    // Deselect
                    delete userVotes[newsId];
                    likeBtn.classList.remove('active');
                } else {
                    userVotes[newsId] = 'LIKE';
                    likeBtn.classList.add('active');
                    dislikeBtn.classList.remove('active');
                }
            } else if (action === 'DISLIKE') {
                if (userVotes[newsId] === 'DISLIKE') {
                    // Deselect
                    delete userVotes[newsId];
                    dislikeBtn.classList.remove('active');
                } else {
                    userVotes[newsId] = 'DISLIKE';
                    dislikeBtn.classList.add('active');
                    likeBtn.classList.remove('active');
                }
            }
        }

        async function submitAllFeedback() {
            const newsItems = document.querySelectorAll('.news-item');
            const promises = [];
            let hasAnyVote = false;

            newsItems.forEach(item => {
                const id = item.getAttribute('data-id');
                const title = item.querySelector('h3').textContent;
                const vote = userVotes[id] || 'NONE';
                const comment = item.querySelector('.comment-area').value.trim();

                // Send if user voted or added a comment
                if (vote !== 'NONE' || comment !== '') {
                    hasAnyVote = true;
                    
                    const payload = {
                        newsTitle: title,
                        vote: vote === 'LIKE' ? 'LUBIĘ' : (vote === 'DISLIKE' ? 'NIE LUBIĘ' : 'BRAK OCENY'),
                        comment: comment
                    };

                    const p = fetch("https://script.google.com/macros/s/AKfycbxDCHUE8sx7QxCZe7c4LKZZ6f7RRykXUvLleGtwkyTGc-j5Ab9oOpuMDbpg1JDXGBemhg/exec", {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });
                    promises.push(p);
                }
            });

            if (!hasAnyVote) {
                alert("Zanim wyślesz, zaznacz przynajmniej jedną opinię lub napisz komentarz!");
                return;
            }

            // Disable submit button during upload
            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Wysyłanie...";
            submitBtn.style.opacity = "0.5";

            try {
                await Promise.all(promises);
                alert("Opinie zostały zapisane bezpośrednio w Twoim Arkuszu Google! ✓");
                // Clear comments and votes
                newsItems.forEach(item => {
                    item.querySelector('.comment-area').value = '';
                });
                document.querySelectorAll('.vote-btn').forEach(btn => btn.classList.remove('active'));
                for (const key in userVotes) delete userVotes[key];
            } catch (err) {
                alert("Wystąpił błąd podczas wysyłania opinii: " + err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Wyślij dzisiejsze opinie (1 kliknięcie)";
                submitBtn.style.opacity = "1";
            }
        }
    </script>
</body>
</html>

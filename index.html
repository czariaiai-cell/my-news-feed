<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piguła Geopolityczna</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: rgba(22, 26, 35, 0.65);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #c5a059; /* Gold accent */
            --like-color: #4caf50;
            --dislike-color: #f44336;
            --text-color: #e5e9f0;
            --text-muted: #8892b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background-image: radial-gradient(circle at 50% 0%, rgba(30, 39, 56, 0.4) 0%, rgba(11, 12, 16, 1) 100%);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin: 20px 0 30px;
            background: linear-gradient(90deg, #ffffff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .news-item {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .news-item:hover {
            transform: translateY(-2px);
            border-color: rgba(197, 160, 89, 0.3);
        }

        .news-item h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .news-item p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-like {
            background: rgba(76, 175, 80, 0.15);
            color: #81c784;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .btn-like:hover {
            background: var(--like-color);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-dislike {
            background: rgba(244, 67, 54, 0.15);
            color: #e57373;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        .btn-dislike:hover {
            background: var(--dislike-color);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3);
        }
    </style>
</head>
<body>
    <h1>Dzisiejsza Piguła</h1>
    <div id="news-container">
        <!-- News 1 -->
        <div class="news-item">
            <h3>Ukraina: "Strefa Śmierci"</h3>
            <p>Drony czynią broń pancerną bezużyteczną na 30 km froncie. Podziemne nory zastępują okopy.</p>
            <div class="btn-group">
                <button class="btn-like" onclick="submitFeedback(1, 'Ukraina: Strefa Śmierci', 'LIKE')">LUBIĘ</button>
                <button class="btn-dislike" onclick="submitFeedback(1, 'Ukraina: Strefa Śmierci', 'DISLIKE')">NIE LUBIĘ</button>
            </div>
        </div>
        <!-- News 2 -->
        <div class="news-item">
            <h3>Eksplozja w Cieśninie Ormuz</h3>
            <p>Tankowiec wpłynął na minę morską po zboczeniu z kursu. Wzrost napięcia w regionie.</p>
            <div class="btn-group">
                <button class="btn-like" onclick="submitFeedback(2, 'Eksplozja w Cieśninie Ormuz', 'LIKE')">LUBIĘ</button>
                <button class="btn-dislike" onclick="submitFeedback(2, 'Eksplozja w Cieśninie Ormuz', 'DISLIKE')">NIE LUBIĘ</button>
            </div>
        </div>
    </div>
    <script>
        function submitFeedback(newsId, newsTitle, action) {
            const title = `${action}: ${newsTitle}`;
            const body = `ID: ${newsId}\nAction: ${action}\nNews: ${newsTitle}`;
            const repoUrl = "https://github.com/czariaiai-cell/my-news-feed";
            const url = `${repoUrl}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
            window.location.href = url;
        }
    </script>
</body>
</html>

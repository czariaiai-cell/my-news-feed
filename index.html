<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piguła Geopolityczna</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --border-color: rgba(15, 23, 42, 0.08);
            --accent-color: #9a7b43;
            --like-color: #2e7d32;
            --dislike-color: #c62828;
            --text-color: #0f172a;
            --text-muted: #64748b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 20px 100px 20px;
            background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, #e2e8f0 100%);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            margin: 10px 0 20px;
            text-align: center;
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(90deg, #0f172a, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        #date-picker {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-color);
            background: var(--panel-bg);
            outline: none;
            cursor: pointer;
            margin: 15px auto 25px;
            display: block;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
        }
        #date-picker:focus {
            border-color: var(--accent-color);
            box-shadow: 0 4px 12px rgba(154,123,67,0.15);
        }
        #mode-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 0 20px;
        }
        .mode-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--panel-bg);
            color: var(--text-muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mode-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        .mode-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .news-grid.cols-1 { grid-template-columns: 1fr; max-width: 680px; margin-left: auto; margin-right: auto; }
        .news-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .cols-switcher {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 0 20px;
        }
        .col-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--panel-bg);
            color: var(--text-muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .col-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        .col-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }
        @media (max-width: 600px) {
            .news-grid.cols-2 { grid-template-columns: 1fr; }
        }
        .news-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03), 0 2px 4px -2px rgba(0,0,0,0.03);
            transition: all 0.25s ease;
            min-height: 250px;
        }
        .news-card:hover {
            transform: translateY(-3px);
            border-color: rgba(154,123,67,0.3);
            box-shadow: 0 12px 20px -3px rgba(0,0,0,0.06), 0 4px 6px -2px rgba(0,0,0,0.06);
        }
        .category {
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }
        .news-card h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1e293b;
            line-height: 1.4;
        }
        .description {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 16px;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .description a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
        }
        .description a:hover {
            border-bottom-color: var(--accent-color);
        }
        .card-bottom {
            margin-top: auto;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        button.vote-btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .btn-like {
            background: rgba(46, 125, 80, 0.05);
            color: var(--like-color);
            border: 1px solid rgba(46, 125, 80, 0.15);
        }
        .btn-like:hover, .btn-like.active {
            background: var(--like-color);
            color: #ffffff;
            border-color: var(--like-color);
            box-shadow: 0 4px 10px rgba(46, 125, 80, 0.15);
        }
        .btn-dislike {
            background: rgba(198, 40, 40, 0.05);
            color: var(--dislike-color);
            border: 1px solid rgba(198, 40, 40, 0.15);
        }
        .btn-dislike:hover, .btn-dislike.active {
            background: var(--dislike-color);
            color: #ffffff;
            border-color: var(--dislike-color);
            box-shadow: 0 4px 10px rgba(198, 40, 40, 0.15);
        }
        .comment-input {
            width: 100%;
            height: 36px;
            background: #f8fafc;
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 6px;
            padding: 0 10px;
            font-family: inherit;
            font-size: 12px;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        .comment-input:focus {
            border-color: var(--accent-color);
            background: #ffffff;
        }
        .submit-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            padding: 14px 20px;
            box-shadow: 0 -4px 12px rgba(15, 23, 42, 0.04);
            z-index: 1000;
        }
        .submit-bar-inner {
            max-width: 1200px;
            margin: 0 auto;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--accent-color), #816635);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(154, 123, 67, 0.2);
            transition: all 0.2s ease;
        }
        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(154, 123, 67, 0.3);
        }
        #status-message {
            text-align: center;
            margin: 50px 0;
            font-size: 15px;
            color: var(--text-muted);
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px dashed var(--border-color);
        }
        .markdown-view {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            line-height: 1.6;
            color: var(--text-color);
        }
        .markdown-view h1, .markdown-view h2, .markdown-view h3, .markdown-view h4, .markdown-view h5, .markdown-view h6 {
            color: var(--accent-color);
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }
        .markdown-view p {
            margin-bottom: 1em;
        }
        .markdown-view a {
            color: var(--accent-color);
            word-break: break-all;
        }
        .markdown-view ul, .markdown-view ol {
            margin-bottom: 1em;
            padding-left: 2em;
        }
        .markdown-view blockquote {
            border-left: 4px solid var(--accent-color);
            padding-left: 1em;
            color: var(--text-muted);
            margin: 1em 0;
        }
        .markdown-view pre {
            background: #f1f5f9;
            padding: 1em;
            border-radius: 8px;
            overflow-x: auto;
        }
        .markdown-view code {
            background: #f1f5f9;
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dzisiejsza Piguła</h1>
            <div class="subtitle" id="date-subtitle">Środa, 28 lipca 2026</div>
            <input type="date" id="date-picker">
        </header>

        <div id="mode-selector">
            <button class="mode-btn active" id="mode-news" data-mode="news">Wiadomości</button>
            <button class="mode-btn" id="mode-land" data-mode="land">Nieruchomości Bytów</button>
        </div>

        <div id="status-message">Ładowanie...</div>

        <div class="cols-switcher">
            <button class="col-btn" id="btn-cols-1" onclick="setCols(1)" title="Jedna kolumna">▌ 1</button>
            <button class="col-btn" id="btn-cols-2" onclick="setCols(2)" title="Dwie kolumny">▌▌ 2</button>
            <button class="col-btn active" id="btn-cols-auto" onclick="setCols('auto')" title="Domyślnie">▌▌▌ Auto</button>
        </div>

        <div class="news-grid" id="news-container" style="display:none;"></div>
    </div>

    <div class="submit-bar">
        <div class="submit-bar-inner">
            <button class="submit-btn" onclick="submitAllFeedback()">Wyślij opinie (1 kliknięcie)</button>
        </div>
    </div>

    <script>
        // Debug flag - set to true to see console logs
        const DEBUG = true;
        
        function debugLog(...args) {
            if (DEBUG) {
                console.log('[PIGULA DEBUG]', ...args);
            }
        }

        debugLog('Script loading...');
        
        const datePicker = document.getElementById('date-picker');
        const newsContainer = document.getElementById('news-container');
        const statusMessage = document.getElementById('status-message');
        const modeButtons = {
            news: document.getElementById('mode-news'),
            land: document.getElementById('mode-land')
        };
        let currentMode = 'news';

        debugLog('Elements found:', { datePicker, newsContainer, statusMessage, modeButtons });

        // Column layout switcher
        function setCols(n) {
            debugLog('Setting columns to:', n);
            newsContainer.classList.remove('cols-1', 'cols-2');
            document.querySelectorAll('.col-btn').forEach(b => b.classList.remove('active'));
            if (n === 1) {
                newsContainer.classList.add('cols-1');
                document.getElementById('btn-cols-1').classList.add('active');
            } else if (n === 2) {
                newsContainer.classList.add('cols-2');
                document.getElementById('btn-cols-2').classList.add('active');
            } else {
                document.getElementById('btn-cols-auto').classList.add('active');
            }
            try { localStorage.setItem('pigula_cols', n); } catch(e) {}
        }

        // Restore saved preference
        (function() {
            try {
                const saved = localStorage.getItem('pigula_cols');
                if (saved === '1') setCols(1);
                else if (saved === '2') setCols(2);
            } catch(e) {
                debugLog('Could not restore column preference:', e);
            }
        })();

        // Initialize date picker to today's date (local time)
        function initDatePicker() {
            debugLog('Initializing date picker...');
            const today = new Date();
            debugLog('Today (local):', today);
            
            // Get timezone offset in milliseconds
            const tzOffset = today.getTimezoneOffset() * 60000;
            debugLog('Timezone offset (ms):', tzOffset);
            
            // Adjust for timezone to get local date string
            const localTime = today.getTime() - tzOffset;
            const localDate = new Date(localTime);
            debugLog('Local date:', localDate);
            
            const localISODate = localDate.toISOString().split('T')[0];
            debugLog('Local ISO date:', localISODate);
            
            datePicker.value = localISODate;
            datePicker.max = localISODate; // Prevent future dates
            
            debugLog('Date picker value set to:', datePicker.value);
        }

        // Initialize date picker on load
        initDatePicker();

        // Listen to date changes
        datePicker.addEventListener('change', (e) => {
            debugLog('Date changed to:', e.target.value);
            loadContent();
        });

        // Listen to mode changes
        modeButtons.news.addEventListener('click', () => setMode('news'));
        modeButtons.land.addEventListener('click', () => setMode('land'));

        // Load content on initial open
        debugLog('Calling initial loadContent()');
        loadContent();

        async function loadContent() {
            const selectedDate = datePicker.value;
            debugLog('Loading content for date:', selectedDate, 'mode:', currentMode);
            
            // Validate date
            if (!selectedDate) {
                debugLog('No date selected, using today');
                initDatePicker(); // Re-initialize if empty
                return loadContent(); // Try again
            }

            // Update human-friendly Polish date in header
            try {
                const dateObj = new Date(selectedDate);
                debugLog('Date object:', dateObj);
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                const formattedDate = dateObj.toLocaleDateString('pl-PL', options);
                debugLog('Formatted date:', formattedDate);
                document.getElementById('date-subtitle').textContent = formattedDate;
            } catch (e) {
                debugLog('Error formatting date:', e);
                document.getElementById('date-subtitle').textContent = selectedDate;
            }

            // Reset dashboard state
            newsContainer.innerHTML = '';
            newsContainer.style.display = 'none';
            statusMessage.style.display = 'block';
            statusMessage.textContent = 'Ładowanie...';

            try {
                let content;
                if (currentMode === 'news') {
                    debugLog('Fetching news for date:', selectedDate);
                    // Fetch daily markdown file from journal
                    const response = await fetch(`journal/${selectedDate}.md`);
                    debugLog('News response status:', response.status);
                    if (!response.ok) {
                        throw new Error(`Brak pliku archiwalnego (status: ${response.status})`);
                    }
                    const text = await response.text();
                    debugLog('News text length:', text.length);
                    content = parseNewsMarkdown(text);
                } else {
                    debugLog('Fetching land data for date:', selectedDate);
                    // Fetch land research markdown
                    const formattedDate = selectedDate.replace(/-/g, '');
                    const landFile = `land/bytow_land_report_${formattedDate}.md`;
                    debugLog('Fetching land file:', landFile);
                    const response = await fetch(landFile);
                    debugLog('Land response status:', response.status);
                    if (!response.ok) {
                        statusMessage.textContent = 'Brak danych o nieruchomościach dla wybranego dnia.';
                        statusMessage.style.display = 'block';
                        newsContainer.style.display = 'none';
                        return;
                    }
                    const text = await response.text();
                    debugLog('Land text length:', text.length);
                    content = await renderLandMarkdown(text);
                }

                debugLog('Content parsed:', currentMode === 'news' ? `${content.length} items` : 'HTML string');

                if (currentMode === 'news') {
                    renderNewsCards(content);
                } else {
                    // For land mode, content is already HTML string
                    newsContainer.innerHTML = `<div class="markdown-view">${content}</div>`;
                }

                // Display results
                statusMessage.style.display = 'none';
                newsContainer.style.display = 'grid';
                debugLog('Content displayed successfully');
            } catch (err) {
                debugLog('Error loading content:', err);
                statusMessage.textContent = 'Brak wiadomości z wybranego dnia. Wybierz inną datę.';
                console.error(err);
            }
        }

        function setMode(mode) {
            debugLog('Setting mode to:', mode);
            Object.keys(modeButtons).forEach(k => {
                modeButtons[k].classList.remove('active');
            });
            modeButtons[mode].classList.add('active');
            currentMode = mode;
            loadContent();
        }

        async function renderLandMarkdown(markdownText) {
            debugLog('Rendering markdown (length:', markdownText.length, ')');
            return marked.parse(markdownText);
        }

        function parseNewsMarkdown(text) {
            debugLog('Parsing news markdown (length:', text.length, ')');
            const items = [];
            const sections = text.split(/(?=^## )/m).filter(s => s.match(/^## \[/));
            debugLog('Found sections:', sections.length);
            let id = 1;
            sections.forEach(section => {
                const headerMatch = section.match(/^## \[(.*?)\]\s*(.*?)\n([\s\S]*)/m);
                if (!headerMatch) return;
                const rawDesc = headerMatch[3]
                    .split('\n')
                    .reduce((acc, l) => {
                        if (acc.done) return acc;
                        if (l.includes('**Title:**') || l.includes('**Vote:**') ||
                            l.includes('**Zsynchronizowano') || l.startsWith('**Comment:**') ||
                            l.startsWith('- **') || l.startsWith('## ')) {
                            acc.done = true; return acc;
                        }
                        if (l.trim()) acc.lines.push(l.trim());
                        return acc;
                    }, { lines:[], done:false })
                    .lines
                    .slice(0,8)
                    .join(' ')
                    .trim();
                items.push({
                    id: id++,
                    category: headerMatch[1].trim(),
                    title: headerMatch[2].trim(),
                    description: rawDesc
                });
            });
            debugLog('Parsed items:', items.length);
            if (items.length === 0) {
                throw new Error('Nie udało się odczytać formatu wiadomości z pliku.');
            }
            return items;
        }

        function renderNewsCards(items) {
            debugLog('Rendering', items.length, 'news cards');
            items.forEach(news => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.setAttribute('data-id', news.id);
                card.innerHTML = `
                    <div>
                        <div class="category">${escapeHtml(stripObsidianLinks(news.category))}</div>
                        <h3>${escapeHtml(stripObsidianLinks(news.title))}</h3>
                        <p class="description">${renderMarkdown(news.description)}</p>
                    </div>
                    <div class="card-bottom">
                        <div class="btn-group">
                            <button class="vote-btn btn-like" onclick="selectVote(${news.id}, 'LIKE')">LUBIĘ</button>
                            <button class="vote-btn btn-dislike" onclick="selectVote(${news.id}, 'DISLIKE')">NIE LUBIĘ</button>
                        </div>
                        <input type="text" class="comment-input" placeholder="Dodaj notatkę (opcjonalnie)...">
                    </div>
                `;
                newsContainer.appendChild(card);
            });
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&')
                .replace(/</g, '<')
                .replace(/>/g, '>')
                .replace(/"/g, '"')
                .replace(/'/g, '&#039;');
        }

        function stripObsidianLinks(str) {
            return str.replace(/\[\[(?:[^]|]*\|)?([^]]+)\]\]/g, '$1');
        }

        function renderMarkdown(str) {
            // 1. Strip Obsidian [[wiki]] links
            str = stripObsidianLinks(str);
            // 2. Convert markdown [text](url) to clickable links
            str = str.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, (_, label, url) => {
                return `<a href="${url}" target="_blank" rel="noopener">${escapeHtml(label)}</a>`;
            });
            // 3. Convert bare URLs to short clickable links (show domain only)
            str = str.replace(/(^|[^"'])(https?:\/\/[^\s)]+)/g, (_, pre, url) => {
                try {
                    const domain = new URL(url).hostname.replace('www.', '');
                    return `${pre}<a href="${url}" target="_blank" rel="noopener">[${domain}]</a>`;
                } catch { return _; }
            });
            // 4. Escape remaining HTML special chars (not inside <a> tags)
            str = str.replace(/&(?!amp;|lt;|gt;|quot;|#039;)/g, '&');
            return str;
        }

        function selectVote(newsId, action) {
            debugLog('Vote selected:', newsId, action);
            const card = document.querySelector(`.news-card[data-id="${newsId}"]`);
            const likeBtn = card.querySelector('.btn-like');
            const dislikeBtn = card.querySelector('.btn-dislike');
            if (action === 'LIKE') {
                if (userVotes[newsId] === 'LIKE') {
                    delete userVotes[newsId];
                    likeBtn.classList.remove('active');
                } else {
                    userVotes[newsId] = 'LIKE';
                    likeBtn.classList.add('active');
                    dislikeBtn.classList.remove('active');
                }
            } else if (action === 'DISLIKE') {
                if (userVotes[newsId] === 'DISLIKE') {
                    delete userVotes[newsId];
                    dislikeBtn.classList.remove('active');
                } else {
                    userVotes[newsId] = 'DISLIKE';
                    dislikeBtn.classList.add('active');
                    likeBtn.classList.remove('active');
                }
            }
        }

        const userVotes = {};

        async function submitAllFeedback() {
            debugol('Submitting feedback...');
            const selectedDate = datePicker.value;
            const newsCards = document.querySelectorAll('.news-card');
            const promises = [];
            let hasAnyVote = false;

            newsCards.forEach(card => {
                const id = card.getAttribute('data-id');
                const title = card.querySelector('h3').textContent;
                const vote = userVotes[id] || 'NONE';
                const comment = card.querySelector('.comment-input').value.trim();

                if (vote !== 'NONE' || comment !== '') {
                    hasAnyVote = true;
                    const payload = {
                        newsTitle: `[${selectedDate}] ${title}`,
                        vote: vote === 'LIKE' ? 'LUBIĘ' : (vote === 'DISLIKE' ? 'NIE LUBIĘ' : 'BRAK OCENY'),
                        comment: comment
                    };
                    const p = fetch("https://script.google.com/macros/s/AKfycbxDCHUE8sx7QxCZe7c4LKZZ6f7RRykXUvLleGtwkyTGc-j5Ab9oOpuMDbpg1JDXGBemhg/exec", {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    promises.push(p);
                }
            });

            if (!hasAnyVote) {
                alert('Zanim wyślesz, zaznacz przynajmniej jedną opinię lub napisz komentarz!');
                return;
            }

            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Wysyłanie...';
            submitBtn.style.opacity = '0.5';

            try {
                await Promise.all(promises);
                alert('Opinie zostały zapisane bezpośrednio w Twoim Arkuszu Google! ✓');
                newsCards.forEach(card => {
                    card.querySelector('.comment-input').value = '';
                });
                document.querySelectorAll('.vote-btn').forEach(btn => btn.classList.remove('active'));
                for (const key in userVotes) delete userVotes[key];
            } catch (err) {
                alert('Wystąpił błąd podczas wysyłania opinii: ' + err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Wyślij opinie (1 kliknięcie)';
                submitBtn.style.opacity = '1';
            }
        }
    </script>
</body>
</html>

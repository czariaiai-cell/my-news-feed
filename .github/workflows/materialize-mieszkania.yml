name: Materialize Mieszkania JSON

on:
  push:
    paths:
      - 'data/.push_transfer/**'
      - 'data/.push_chunks/**'
      - '.github/workflows/materialize-mieszkania.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/.push_work
          if [ -f data/mieszkania.json ]; then
            cp data/mieszkania.json data/.push_work/previous_mieszkania.json
          fi

          python - <<'PY'
          import json
          import subprocess
          from datetime import date
          from pathlib import Path

          p = Path('data/mieszkania.json')
          old_path = Path('data/.push_work/previous_mieszkania.json')
          patch_path = Path('data/.push_transfer/purchase_patch.json')
          transfer_path = Path('data/.push_transfer/mieszkania.json.gz.b64')

          if patch_path.exists():
              assert old_path.exists(), 'purchase patch requires an existing production baseline'
              d = json.loads(old_path.read_text(encoding='utf-8'))
              patch = json.loads(patch_path.read_text(encoding='utf-8'))
              assert isinstance(patch, list) and patch, 'purchase_patch must be a non-empty list'
              assert isinstance(d.get('purchase'), list) and d['purchase'], 'previous purchase baseline is invalid'
              assert isinstance(d.get('rental'), list) and d['rental'], 'previous rental baseline is invalid'
              by_id = {str(r['listing_id']): r for r in d['purchase']}
              for row in patch:
                  assert isinstance(row, dict), 'patch row must be an object'
                  lid = str(row.get('listing_id', ''))
                  assert lid, 'patch row missing listing_id'
                  by_id[lid] = row
              d['purchase'] = list(by_id.values())
              d['generated_at'] = str(date.today())
              p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          else:
              assert transfer_path.exists(), 'no purchase patch or full transfer found'
              gz = Path('data/.push_work/mieszkania.json.gz')
              raw = Path('data/.push_work/incoming_mieszkania.json')
              import base64, gzip
              gz.write_bytes(base64.b64decode(transfer_path.read_bytes()))
              raw.write_bytes(gzip.decompress(gz.read_bytes()))
              p.write_bytes(raw.read_bytes())
          PY

          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          p = Path('data/mieszkania.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          old_path = Path('data/.push_work/previous_mieszkania.json')
          old = json.loads(old_path.read_text(encoding='utf-8')) if old_path.exists() else None

          assert isinstance(d, dict), 'JSON root must be an object'
          assert isinstance(d.get('purchase'), list), 'purchase must be a list'
          assert isinstance(d.get('rental'), list), 'rental must be a list'
          assert d['purchase'], 'purchase must not be empty'
          assert d['rental'], 'rental must not be empty'
          assert d.get('generated_at'), 'generated_at is required'
          datetime.fromisoformat(str(d['generated_at']).replace('Z', '+00:00'))

          for market in ('purchase', 'rental'):
              ids = []
              for row in d[market]:
                  assert isinstance(row, dict), f'{market} row must be an object'
                  listing_id = row.get('listing_id')
                  assert listing_id not in (None, ''), f'{market} row missing listing_id'
                  ids.append(str(listing_id))
              assert len(ids) == len(set(ids)), f'{market} contains duplicate listing_id values'

          if old is not None:
              assert isinstance(old.get('purchase'), list) and old['purchase'], 'previous purchase baseline is invalid'
              assert isinstance(old.get('rental'), list) and old['rental'], 'previous rental baseline is invalid'
              old_rental = json.dumps(old['rental'], ensure_ascii=False, sort_keys=True, separators=(',', ':'))
              new_rental = json.dumps(d['rental'], ensure_ascii=False, sort_keys=True, separators=(',', ':'))
              assert new_rental == old_rental, 'SAFETY STOP: purchase update changed rental data'

          print(f"VALID: {p.stat().st_size} bytes; purchase={len(d['purchase'])}; rental={len(d['rental'])}")
          PY

      - name: Commit production JSON
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/.push_transfer data/.push_chunks data/.push_work
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Update Mieszkania Polska rental and purchase data'
          git push

# Triggered intentionally after a validated purchase transfer is prepared.

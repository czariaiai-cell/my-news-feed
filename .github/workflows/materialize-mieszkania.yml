name: Materialize Mieszkania JSON

on:
  push:
    paths:
      - 'Rynek mieszkań/rynek_kupna_mieszkan.csv'
      - 'Rynek mieszkań/rynek_najmu_zabrze_sosnowiec.csv'
      - 'data/.push_transfer/**'
      - 'data/.push_chunks/**'
      - '.github/workflows/materialize-mieszkania.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and materialize from canonical CSV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from datetime import datetime,timezone
          from pathlib import Path
          P=Path('Rynek mieszkań/rynek_kupna_mieszkan.csv')
          R=Path('Rynek mieszkań/rynek_najmu_zabrze_sosnowiec.csv')
          J=Path('data/mieszkania.json')
          def read(p):
              assert p.exists() and p.stat().st_size, f'missing/empty {p}'
              with p.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
              assert rows, f'no records {p}'
              ids=[str(x.get('listing_id','')).strip() for x in rows]
              assert all(ids), f'missing listing_id in {p}'
              assert len(ids)==len(set(ids)), f'duplicate listing_id in {p}'
              return rows
          purchase=read(P); rental=read(R)
          assert J.exists() and J.stat().st_size, 'production JSON baseline missing'
          old=json.loads(J.read_text(encoding='utf-8'))
          assert old.get('purchase') and old.get('rental'), 'production baseline invalid'
          d={'generated_at':datetime.now(timezone.utc).isoformat(),'source':'Canonical CSV — MieszkaniePolska','purchase':purchase,'rental':rental}
          d['summary']={'purchase':{'total':len(purchase),'active':sum(str(x.get('status','')).lower()=='active' for x in purchase),'new_today':sum(x.get('first_seen')==datetime.now().date().isoformat() for x in purchase)},'rental':{'total':len(rental),'active':sum(str(x.get('status','')).lower()=='active' for x in rental),'new_today':sum(x.get('first_seen')==datetime.now().date().isoformat() for x in rental)}}
          J.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          check=json.loads(J.read_text(encoding='utf-8'))
          assert check['purchase'] and check['rental'] and check['generated_at']
          print(f"VALID purchase={len(purchase)} rental={len(rental)} generated_at={check['generated_at']}")
          PY
      - name: Commit production JSON
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mieszkania.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize Mieszkania production JSON'
          git push
